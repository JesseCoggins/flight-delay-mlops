name: Validate API and Docker image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "deployment_api.py"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Docker image
        run: docker build --pull --progress=plain -t flight-delay-validation .

      - name: Run the six API tests in the image
        run: |
          docker run --rm --entrypoint python \
            --mount type=bind,src="${GITHUB_WORKSPACE}/tests",dst=/app/tests,readonly \
            flight-delay-validation -m pytest -q -p no:cacheprovider tests

      - name: Smoke-test the running service
        run: |
          docker run --detach --rm --name flight-delay-check \
            --publish 127.0.0.1:8000:8000 flight-delay-validation
          ready=false
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs flight-delay-check
            exit 1
          fi
          docker exec flight-delay-check python -c "import json, math, urllib.request; result=json.load(urllib.request.urlopen('http://127.0.0.1:8000/predict/delays?dest_airport=LAX&departure_time=14:30&arrival_time=17:45')); value=result['average_departure_delay_minutes']; assert isinstance(value,(int,float)) and math.isfinite(value); print('Prediction smoke test passed')"

      - name: Stop the validation container
        if: always()
        run: docker rm --force flight-delay-check 2>/dev/null || true
